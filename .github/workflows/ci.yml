name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 build_native.py
      - run: python3 -m unittest discover -s . -p 'test_*.py' -v
      - run: for file in static/*.js; do node --check "$file"; done
