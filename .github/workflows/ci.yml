name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: gosx-host/go.sum
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        with:
          ffmpeg-version: release
          architecture: x64
          github-token: ${{ github.token }}
      - if: runner.os == 'macOS'
        run: go -C gosx-host run ./cmd/native
      - if: runner.os == 'Linux'
        run: go install m31labs.dev/gosx/cmd/gosx@v0.57.24
      - run: node --check gosx-host/workspace.js
      - working-directory: gosx-host
        shell: bash
        run: |
          mkdir -p ../build/verification
          go test -json ./... | tee ../build/verification/go-tests-${{ runner.os }}.jsonl
        env:
          CGO_ENABLED: '0'
          STORYBOARD_REQUIRE_FFMPEG: '1'
          STORYBOARD_REQUIRE_NATIVE: ${{ runner.os == 'macOS' && '1' || '0' }}
          STORYBOARD_REQUIRE_GOSX: ${{ runner.os == 'Linux' && '1' || '0' }}
      - working-directory: gosx-host
        run: go vet ./...
      - if: runner.os == 'Linux'
        working-directory: gosx-host
        run: go test -race ./...
      - working-directory: gosx-host
        run: go run ./cmd/package
      - if: runner.os == 'Windows'
        working-directory: gosx-host
        run: go run ./cmd/package -target windows-arm64 -output-dir ../build/windows-arm64
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ runner.os }}
          path: build/verification/*.jsonl
